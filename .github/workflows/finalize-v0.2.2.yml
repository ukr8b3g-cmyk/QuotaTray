name: finalize-v0.2.2

on:
  push:
    branches: ['fix/history-show-all']
    paths:
      - '.github/scripts/finalize-v0.2.2.ps1'
      - '.github/workflows/finalize-v0.2.2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/history-show-all
          fetch-depth: 0
      - name: Apply release metadata and cleanup
        shell: pwsh
        run: ./.github/scripts/finalize-v0.2.2.ps1
