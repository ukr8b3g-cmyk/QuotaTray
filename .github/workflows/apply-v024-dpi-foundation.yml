name: apply-v0.2.4-dpi-foundation

on:
  push:
    branches: [fix/v0.2.4-dpi-scaling]
    paths:
      - '.github/workflows/apply-v024-dpi-foundation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.2.4-dpi-scaling
          fetch-depth: 0

      - name: Patch common DPI form foundation
        shell: pwsh
        run: |
          $path = 'src/QuantaTrain.App/UiControls.cs'
          $lines = [System.Collections.Generic.List[string]](Get-Content $path)
          $fontIndex = $lines.IndexOf('        Font = Theme.Ui();')
          if ($fontIndex -lt 0) {
            throw 'FramelessForm font anchor was not found.'
          }
          if ($lines -notcontains '        AutoScaleDimensions = new SizeF(96F, 96F);') {
            $lines.Insert($fontIndex + 1, '        AutoScaleDimensions = new SizeF(96F, 96F);')
            $lines.Insert($fontIndex + 2, '        AutoScaleMode = AutoScaleMode.Dpi;')
          }
          Set-Content $path $lines

          $source = Get-Content $path -Raw
          $pattern = '(?s)internal abstract class FixedWidthResizableForm : FramelessForm\r?\n\{.*?\r?\n\}\r?\n\r?\ninternal sealed class RoundedPanel : Panel'
          $replacement = @'
          internal abstract class FixedWidthResizableForm : FramelessForm
          {
              private const int WmNcHitTest = 0x0084;
              private const int HtClient = 1;
              private const int HtBottom = 15;

              protected void ConfigureFixedLogicalWidth(
                  int logicalWidth,
                  int logicalHeight,
                  int minimumLogicalHeight)
              {
                  ClientSize = new Size(logicalWidth, logicalHeight);
                  MinimumSize = new Size(logicalWidth, minimumLogicalHeight);
                  MaximumSize = new Size(logicalWidth, 2160);
              }

              protected override void WndProc(ref Message message)
              {
                  base.WndProc(ref message);
                  if (message.Msg != WmNcHitTest ||
                      message.Result.ToInt32() != HtClient)
                  {
                      return;
                  }

                  var packed = message.LParam.ToInt64();
                  var screenPoint = new Point(
                      unchecked((short)(packed & 0xffff)),
                      unchecked((short)((packed >> 16) & 0xffff)));
                  var clientPoint = PointToClient(screenPoint);
                  const int grip = 7;
                  if (clientPoint.Y >= ClientSize.Height - grip)
                  {
                      message.Result = HtBottom;
                  }
              }
          }

          internal sealed class RoundedPanel : Panel
          '@
          $matches = [regex]::Matches($source, $pattern)
          if ($matches.Count -ne 1) {
            throw "Expected one FixedWidthResizableForm block, found $($matches.Count)."
          }
          $source = [regex]::Replace($source, $pattern, $replacement, 1)
          Set-Content $path $source -NoNewline

          $updated = Get-Content $path -Raw
          if ($updated -notmatch 'AutoScaleDimensions = new SizeF\(96F, 96F\);') {
            throw 'Common 96-DPI design baseline was not added.'
          }
          if ($updated -match 'private int _fixedWidth|WmDpiChanged|override void SetBoundsCore') {
            throw 'Legacy physical-width locking remains.'
          }

      - name: Restore, build, and test
        shell: pwsh
        run: |
          dotnet restore QuantaTrain.slnx
          dotnet build QuantaTrain.slnx -c Release --no-restore
          dotnet test QuantaTrain.slnx -c Release --no-build

      - name: Commit tested source change
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/apply-v024-dpi-foundation.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/QuantaTrain.App/UiControls.cs .github/workflows/apply-v024-dpi-foundation.yml
          git commit -m 'Fix common high-DPI form scaling'
          git push origin HEAD:fix/v0.2.4-dpi-scaling
