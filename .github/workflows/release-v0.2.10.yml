name: release-v0.2.10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.2.10.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-v0.2.10
  cancel-in-progress: false

jobs:
  package-and-release:
    if: github.repository == 'ukr8b3g-cmyk/QuotaTray' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: '0.2.10'
    steps:
      - uses: actions/checkout@v6
      - name: Guard new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          [xml]$props = Get-Content Directory.Build.props
          if ($props.Project.PropertyGroup.Version -ne $version) { throw 'Source version mismatch.' }
          if ((Get-Content RELEASE_NOTES.md -First 1) -ne "# QuantaTray v$version") { throw 'Release notes version mismatch.' }
          $releaseTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          if ($releaseTags -contains "v$version") { throw 'Release already exists; refusing to overwrite.' }
          $tags = git ls-remote --tags origin "refs/tags/v$version"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing tags.' }
          if ($tags) { throw 'Tag already exists; refusing to overwrite.' }
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore QuantaTrain.slnx
      - run: dotnet build QuantaTrain.slnx -c Release --no-restore
      - run: dotnet test QuantaTrain.slnx -c Release --no-build
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and verify release packages
        shell: pwsh
        run: |
          ./packaging/scripts/build-release.ps1 -Version $env:RELEASE_VERSION
          ./packaging/scripts/verify-release.ps1 -Version $env:RELEASE_VERSION
      - name: Require build and CodeQL success for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('.github/workflows/build.yml', 'dynamic/github-code-scanning/codeql')
          $deadline = [DateTime]::UtcNow.AddMinutes(15)
          do {
            $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect checks for this commit.' }
            $ready = $true
            foreach ($path in $required) {
              $run = $response.workflow_runs | Where-Object { $_.path -eq $path -and $_.head_sha -eq $env:GITHUB_SHA } |
                Sort-Object id -Descending | Select-Object -First 1
              if (-not $run -or $run.status -ne 'completed') { $ready = $false; continue }
              if ($run.conclusion -ne 'success') { throw "Required check failed: $path ($($run.conclusion))" }
            }
            if ($ready) { break }
            if ([DateTime]::UtcNow -ge $deadline) { throw 'Required checks did not finish; no release published.' }
            Start-Sleep -Seconds 20
          } while ($true)
          Write-Host "Build and CodeQL passed for $env:GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: release-v0.2.10-win-x64
          if-no-files-found: error
          path: |
            dist/QuantaTray-v0.2.10-win-x64-setup.exe
            dist/QuantaTray-v0.2.10-win-x64-portable.zip
            dist/SHA256SUMS.txt
      - name: Upload draft, verify uploaded bytes, and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          $assets = @("dist/QuantaTray-$tag-win-x64-setup.exe", "dist/QuantaTray-$tag-win-x64-portable.zip", 'dist/SHA256SUMS.txt')
          gh release create $tag --draft --target $env:GITHUB_SHA --title "QuantaTray $tag" --notes-file RELEASE_NOTES.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; nothing published.' }
          $apiUrl = gh release view $tag --json apiUrl --jq .apiUrl
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect draft release.' }
          $release = gh api $apiUrl | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read uploaded assets.' }
          if (-not $release.draft -or $release.tag_name -ne $tag -or $release.target_commitish -ne $env:GITHUB_SHA -or $release.assets.Count -ne 3) {
            throw 'Draft metadata does not match this build.'
          }
          foreach ($path in $assets) {
            $local = Get-Item -LiteralPath $path
            $remote = @($release.assets | Where-Object name -eq $local.Name)
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remote.Count -ne 1 -or $remote[0].state -ne 'uploaded' -or $remote[0].size -ne $local.Length -or $remote[0].digest -ne $digest) {
              throw "Uploaded asset verification failed: $($local.Name)"
            }
          }
          $download = Join-Path $env:RUNNER_TEMP 'verify-release-download'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $tag --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download draft assets for verification.' }
          foreach ($path in $assets) {
            $name = [IO.Path]::GetFileName($path)
            if ((Get-FileHash -LiteralPath (Join-Path $download $name) -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash) {
              throw "Downloaded asset checksum mismatch: $name"
            }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed; verified draft remains for review.' }
          $published = gh api $apiUrl | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.draft -or -not $published.published_at) { throw 'Publication could not be verified.' }
          $tagRef = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $tagRef.object.sha -ne $env:GITHUB_SHA) { throw 'Published tag does not match build commit.' }
          Write-Host "Published verified release: $($published.html_url)"
