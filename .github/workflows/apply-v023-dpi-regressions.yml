name: apply-v023-dpi-regressions

on:
  push:
    branches: [fix/v023-dpi-regressions]
    paths:
      - '.github/workflows/apply-v023-dpi-regressions.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v023-dpi-regressions

      - name: Patch compact layout and regression test
        shell: pwsh
        run: |
          $compactPath = 'src/QuantaTrain.App/CompactForm.cs'
          $compact = Get-Content $compactPath -Raw
          $compact = $compact.Replace("            22);", "            24);")
          $compact = $compact.Replace("            30);", "            32);")
          Set-Content $compactPath $compact -NoNewline

          $testPath = 'tests/QuantaTrain.App.Tests/RuntimeAppearanceTests.cs'
          $tests = Get-Content $testPath -Raw
          $old = '            Assert.Equal(new Size(240, 338), compact.ClientSize);'
          $new = @'
            Assert.True(
                compact.ClientSize.Width >= 286,
                $"Compact width was {compact.ClientSize.Width}.");
            Assert.True(
                compact.ClientSize.Height >= 384,
                $"Compact height was {compact.ClientSize.Height}.");
'@
          if (-not $tests.Contains($old)) { throw 'Old compact size assertion was not found.' }
          $tests = $tests.Replace($old, $new.TrimEnd())
          Set-Content $testPath $tests -NoNewline

          if ($compact -notmatch '_remainingPercent\.PreferredWidth - 13,\s*24\);') { throw 'Percent position patch failed.' }
          if ($compact -notmatch '_remainingPrefix\.PreferredWidth - 4,\s*32\);') { throw 'Prefix position patch failed.' }
          if ($tests -notmatch 'compact\.ClientSize\.Width >= 286') { throw 'Test patch failed.' }

      - name: Commit fixes to branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/QuantaTrain.App/CompactForm.cs tests/QuantaTrain.App.Tests/RuntimeAppearanceTests.cs
          git commit -m 'Fix high-DPI compact layout regressions'
          git push origin HEAD:fix/v023-dpi-regressions
