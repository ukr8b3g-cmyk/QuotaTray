name: apply-history-show-all

on:
  pull_request:
    branches: ['main']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/history-show-all
          fetch-depth: 0
      - name: Apply focused replacements
        run: python .github/scripts/apply-history-show-all.py
      - name: Commit focused changes
        shell: bash
        run: |
          rm .github/history-show-all.patch
          rm .github/scripts/apply-history-show-all.py
          rm .github/workflows/apply-history-show-all.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix full reset history display"
          git push origin HEAD:fix/history-show-all
