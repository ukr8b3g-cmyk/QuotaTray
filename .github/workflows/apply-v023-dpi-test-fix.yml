name: apply-v0.2.3-dpi-test-fix

on:
  push:
    branches: [fix/v0.2.3-high-dpi-tests-final]
    paths:
      - '.github/workflows/apply-v023-dpi-test-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.2.3-high-dpi-tests-final
      - name: Apply focused fixes
        shell: pwsh
        run: |
          $compactPath = 'src/QuantaTrain.App/CompactForm.cs'
          $compact = Get-Content $compactPath -Raw
          $compact = $compact.Replace('_quotaCard.ClientSize.Width - _remainingPercent.PreferredWidth - 13,`r`n            22);', '_quotaCard.ClientSize.Width - _remainingPercent.PreferredWidth - 13,`r`n            24);')
          $compact = $compact.Replace('_remainingPercent.Left - _remainingPrefix.PreferredWidth - 4,`r`n            30);', '_remainingPercent.Left - _remainingPrefix.PreferredWidth - 4,`r`n            32);')
          Set-Content $compactPath $compact -NoNewline

          $testPath = 'tests/QuantaTrain.App.Tests/RuntimeAppearanceTests.cs'
          $tests = Get-Content $testPath -Raw
          $tests = $tests.Replace('Assert.Equal(new Size(240, 338), compact.ClientSize);', @'
Assert.True(
                compact.ClientSize.Width >= 286,
                $"Compact width was {compact.ClientSize.Width}.");
            Assert.True(
                compact.ClientSize.Height >= 384,
                $"Compact height was {compact.ClientSize.Height}.");
'@)
          Set-Content $testPath $tests -NoNewline

          Remove-Item '.github/workflows/apply-v023-dpi-test-fix.yml'
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/QuantaTrain.App/CompactForm.cs tests/QuantaTrain.App.Tests/RuntimeAppearanceTests.cs .github/workflows/apply-v023-dpi-test-fix.yml
          git commit -m 'Fix high-DPI layout tests'
          git push origin HEAD:fix/v0.2.3-high-dpi-tests-final
