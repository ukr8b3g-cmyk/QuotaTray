name: dispatch-v023-branch-fix-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-v023-branch-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v023-dpi-regressions

      - name: Apply line-based edits
        shell: pwsh
        run: |
          $compactPath = 'src/QuantaTrain.App/CompactForm.cs'
          $compactLines = [System.Collections.Generic.List[string]](Get-Content $compactPath)
          $percentIndex = -1
          $prefixIndex = -1
          for ($i = 0; $i -lt $compactLines.Count; $i++) {
            if ($compactLines[$i] -like '*_quotaCard.ClientSize.Width - _remainingPercent.PreferredWidth - 13,*') { $percentIndex = $i }
            if ($compactLines[$i] -like '*_remainingPercent.Left - _remainingPrefix.PreferredWidth - 4,*') { $prefixIndex = $i }
          }
          if ($percentIndex -lt 0 -or $prefixIndex -lt 0) { throw 'Compact position anchors were not found.' }
          $compactLines[$percentIndex + 1] = '            24);'
          $compactLines[$prefixIndex + 1] = '            32);'
          Set-Content $compactPath $compactLines

          $testPath = 'tests/QuantaTrain.App.Tests/RuntimeAppearanceTests.cs'
          $testLines = [System.Collections.Generic.List[string]](Get-Content $testPath)
          $assertIndex = $testLines.IndexOf('            Assert.Equal(new Size(240, 338), compact.ClientSize);')
          if ($assertIndex -lt 0) { throw 'Old compact size assertion was not found.' }
          $testLines.RemoveAt($assertIndex)
          $replacement = [string[]]@(
            '            Assert.True(',
            '                compact.ClientSize.Width >= 286,',
            '                $"Compact width was {compact.ClientSize.Width}.");',
            '            Assert.True(',
            '                compact.ClientSize.Height >= 384,',
            '                $"Compact height was {compact.ClientSize.Height}.");'
          )
          for ($j = $replacement.Length - 1; $j -ge 0; $j--) { $testLines.Insert($assertIndex, $replacement[$j]) }
          Set-Content $testPath $testLines

          if ((Get-Content $compactPath -Raw) -notmatch '_remainingPercent\.PreferredWidth - 13,\s*24\);') { throw 'Percent edit failed.' }
          if ((Get-Content $compactPath -Raw) -notmatch '_remainingPrefix\.PreferredWidth - 4,\s*32\);') { throw 'Prefix edit failed.' }
          if ((Get-Content $testPath -Raw) -notmatch 'compact\.ClientSize\.Width >= 286') { throw 'Test edit failed.' }

      - name: Commit to fix branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/QuantaTrain.App/CompactForm.cs tests/QuantaTrain.App.Tests/RuntimeAppearanceTests.cs
          git commit -m 'Fix high-DPI compact layout regressions'
          git push origin HEAD:fix/v023-dpi-regressions
