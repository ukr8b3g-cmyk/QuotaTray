name: publish-v0.2.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.2.4.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize README and remove one-shot workflow
        shell: pwsh
        run: |
          $readme = Get-Content README.md -Raw
          $updated = $readme.Replace('QuantaTray-v0.2.3-', 'QuantaTray-v0.2.4-')
          if ($updated -eq $readme) {
            throw 'No v0.2.3 download filenames were found in README.md.'
          }
          if ($updated -match 'QuantaTray-v0\.2\.3-') {
            throw 'README.md still contains v0.2.3 download filenames.'
          }
          Set-Content README.md $updated -NoNewline

          Remove-Item '.github/workflows/publish-v0.2.4.yml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/publish-v0.2.4.yml
          git commit -m 'Finalize QuantaTray v0.2.4 release'
          git push origin HEAD:main

          $releaseTarget = git rev-parse HEAD
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TARGET=$releaseTarget"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore QuantaTrain.slnx
          dotnet test QuantaTrain.slnx -c Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build v0.2.4 release assets
        shell: pwsh
        run: ./packaging/scripts/build-release.ps1 -Version '0.2.4'

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(
            'dist/QuantaTray-v0.2.4-win-x64-setup.exe',
            'dist/QuantaTray-v0.2.4-win-x64-portable.zip',
            'dist/SHA256SUMS.txt'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              throw "Missing release asset: $asset"
            }
          }

      - uses: actions/upload-artifact@v6
        with:
          name: release-v0.2.4-win-x64
          path: |
            dist/QuantaTray-v0.2.4-win-x64-setup.exe
            dist/QuantaTray-v0.2.4-win-x64-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'dist/QuantaTray-v0.2.4-win-x64-setup.exe',
            'dist/QuantaTray-v0.2.4-win-x64-portable.zip',
            'dist/SHA256SUMS.txt'
          )

          gh release view 'v0.2.4' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload 'v0.2.4' $assets --clobber
            gh release edit 'v0.2.4' `
              --title 'QuantaTray v0.2.4' `
              --notes-file RELEASE_NOTES.md `
              --draft=false
          }
          else {
            gh release create 'v0.2.4' `
              --target "$env:RELEASE_TARGET" `
              --title 'QuantaTray v0.2.4' `
              --notes-file RELEASE_NOTES.md `
              $assets
          }
