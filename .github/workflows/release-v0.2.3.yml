name: release-v0.2.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.2.3.yml'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore QuantaTrain.slnx
      - run: dotnet test QuantaTrain.slnx -c Release --no-restore
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build release assets
        shell: pwsh
        run: ./packaging/scripts/build-release.ps1 -Version 0.2.3
      - uses: actions/upload-artifact@v6
        with:
          name: release-win-x64
          path: |
            dist/QuantaTray-v0.2.3-win-x64-setup.exe
            dist/QuantaTray-v0.2.3-win-x64-portable.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.2.3' `
            --target '${{ github.sha }}' `
            --title 'QuantaTray v0.2.3' `
            --notes-file RELEASE_NOTES.md `
            dist/QuantaTray-v0.2.3-win-x64-setup.exe `
            dist/QuantaTray-v0.2.3-win-x64-portable.zip `
            dist/SHA256SUMS.txt
