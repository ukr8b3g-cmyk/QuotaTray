name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore QuantaTrain.slnx
      - run: dotnet test QuantaTrain.slnx -c Release --no-restore
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build release assets
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./packaging/scripts/build-release.ps1 -Version $version
      - uses: actions/upload-artifact@v6
        with:
          name: release-win-x64
          path: |
            dist/QuantaTray-v*-win-x64-setup.exe
            dist/QuantaTray-v*-win-x64-portable.zip
            dist/SHA256SUMS.txt
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            --draft `
            --title 'QuantaTray ${{ github.ref_name }}' `
            --notes-file RELEASE_NOTES.md `
            dist/QuantaTray-v*-win-x64-setup.exe `
            dist/QuantaTray-v*-win-x64-portable.zip `
            dist/SHA256SUMS.txt
